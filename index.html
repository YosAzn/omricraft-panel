<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- ?v=2 busts the browser's aggressive favicon cache so the new frameless
         head replaces the old framed icon; SVG first for modern browsers. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="icon" type="image/png" href="/favicon.png?v=3" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <meta name="theme-color" content="#0b0b0d" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OmriCraft</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Unregister any cached service workers to prevent stale JS
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(reg) { reg.unregister(); });
        });
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
