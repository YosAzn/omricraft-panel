# OmriCraft manager-api TLS front (P3 Phase 2).
# api.omricraft.com (wildcard *.omricraft.com -> the VPS) terminates TLS here and
# proxies to the manager-api on localhost:3001. Cloud Functions call https://api.omricraft.com
# so the bearer key never travels in cleartext, and raw :3001 is closed to the internet
# (only nginx + ServerWaker/auto-stop reach 127.0.0.1:3001).
#
# certbot --nginx adds the `listen 443 ssl` + cert lines + the 80->443 redirect; this
# file is the pre-certbot starting point (kept in the repo for reproducibility — it is
# deployed manually to /etc/nginx/sites-available/, NOT by the oracle CI rsync).
server {
    listen 80;
    listen [::]:80;
    server_name api.omricraft.com;

    # manager-api accepts up to 10mb JSON (base64 server icons) — allow it through nginx.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
