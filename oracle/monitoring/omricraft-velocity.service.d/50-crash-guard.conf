# ===========================================================================
# 50-crash-guard.conf — systemd DROP-IN for omricraft-velocity.service
#
# WHY: the base unit is Restart=always / RestartSec=10, so a proxy that CRASH-LOOPS
# (bad config, stolen :25565, OOM) just restarts forever — burning CPU and hiding a
# real fault behind "it's running". This drop-in bounds that: if it fails 5 times in
# 300s, systemd STOPS trying and leaves it `failed` (visible), and every failure
# fires OnFailure -> the notifier below, so a human is told instead of the loop
# silently churning. This is the "stuck/looping service" half of the safety net;
# health.sh (cron TCP probe) is the "up but not listening" half.
#
# This is a SEPARATE file from oom.conf on purpose — drop-ins merge, so this does
# NOT touch the existing OOMScoreAdjust=-800.
#
# NOTE: StartLimitIntervalSec / StartLimitBurst / OnFailure are [Unit] directives
# in modern systemd (NOT [Service]) — putting them under [Service] silently no-ops.
#
# APPLY (manual, on the VPS — deploy only ships oracle/scripts/, see ../README.md):
#   sudo mkdir -p /etc/systemd/system/omricraft-velocity.service.d
#   sudo cp 50-crash-guard.conf /etc/systemd/system/omricraft-velocity.service.d/
#   sudo cp ../omricraft-notify@.service /etc/systemd/system/
#   sudo systemctl daemon-reload
#   # (no restart needed; takes effect on the next start/failure)
#
# ROLLBACK:
#   sudo rm /etc/systemd/system/omricraft-velocity.service.d/50-crash-guard.conf
#   sudo rm /etc/systemd/system/omricraft-notify@.service
#   sudo systemctl daemon-reload
# ===========================================================================

[Unit]
# Give up after 5 failed starts within a 5-minute window (instead of looping forever).
StartLimitIntervalSec=300
StartLimitBurst=5
# On every failure, run the notifier (templated with this unit's name).
OnFailure=omricraft-notify@%n.service
