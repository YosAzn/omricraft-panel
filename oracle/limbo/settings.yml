#
# NanoLimbo configuration — OmriCraft seamless-wake holding world.
# Players land here (no kick) while their backend boots, then VelocityLimboHandler
# transfers them in automatically. Localhost-only; only Velocity connects to it.
#

# Bind localhost-only on 25564 (proxy=25565, backends=25566-25576). Never internet-exposed.
bind:
  ip: "127.0.0.1"
  port: 25564

maxPlayers: 100

ping:
  description: "<#09add3>OmriCraft <white>— waking your server"
  version: "OmriCraft"
  protocol: -1

# THE_END = clean void feel; spectator hides HP/hunger bars.
dimension: THE_END

playerList:
  enable: true
  username: "OmriCraft"

headerAndFooter:
  enable: true
  header: "<#09add3>OmriCraft"
  footer: "<gray>Starting your server…"

gameMode: 3

secureProfile: false

brandName:
  enable: true
  content: "OmriCraft"

joinMessage:
  enable: true
  text: "<#09add3>Waking your server up…<white> you'll be moved in automatically."

bossBar:
  enable: true
  text: "<#09add3>Starting your server…<white> please hold"
  health: 1.0
  color: BLUE
  division: SOLID

title:
  enable: true
  title: "<#09add3><b>Almost there"
  subtitle: "<white>Booting your world…"
  fadeIn: 10
  stay: 100
  fadeOut: 10

# MUST match Velocity's MODERN forwarding secret. On the VPS this is set to the literal
# string  @forwarding.secret  — NanoLimbo's '@<file>' syntax reads the value from the
# sibling forwarding.secret file (copied from velocity/forwarding.secret), so the secret
# itself is never stored here or in the repo. This repo copy uses a placeholder; set it
# to '@forwarding.secret' on deploy (see README.md).
infoForwarding:
  type: MODERN
  secret: '<READ_FROM_forwarding.secret_file>'
  tokens:
  - "<BUNGEE_GUARD_TOKEN>"

readTimeout: 30000

# Privacy: redact player IPs in logs (matches the panel's posture).
logPlayersIp: false

debugLevel: 2

netty:
  transportType: EPOLL
  threads:
    bossGroup: 1
    workerGroup: 2

traffic:
  enable: true
  maxPacketSize: 8192
  interval: 7.0
  maxPacketRate: 500.0
  maxPacketBytesRate: 2048.0
